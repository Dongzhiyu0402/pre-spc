# Alembic 配置（迁移脚本；生产 DDL 以 api/schema.sql 为准）
[alembic]
script_location = alembic
prepend_sys_path = ..
sqlalchemy.url = postgresql+asyncpg://pre:pre@localhost:5432/pre_spc

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
